name: Preview Release
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
  preview-release:
    timeout-minutes: 30
    runs-on: depot-ubuntu-22.04-2
    permissions:
      contents: write
      pull-requests: write
    container:
      image: node:24
    steps:
      - name: Checkout Repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 2
      - run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: pnpm setup
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Install packages
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Find changed source files
        id: changed_source
        uses: tj-actions/changed-files@3c4bc6fa0ca4718d438e0a4bd3ea81fbb0e6e2be
        with:
          files: src/**
      - name: Run Build
        if: steps.changed_source.outputs.any_changed == 'true'
        run: pnpm build
      - name: Publish to pkg.pr.new
        if: steps.changed_source.outputs.any_changed == 'true'
        run: pnpm pkg-pr-new publish --pnpm
